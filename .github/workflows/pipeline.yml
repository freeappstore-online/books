name: Catalogue pipeline

# Guards the catalogue's texts (books#38): unit and consistency tests of the pipeline scripts,
# and a rebuild of every book from its locked Gutenberg source, compared with the committed
# edition/texts/<slug>.json. A hand edit of a catalogue file, or a change to fetch.py that
# re-splits a book (which would misalign its narration, keyed by chapter), fails here.
# How to run the same checks locally: docs/catalogue-pipeline.md.

on:
  push:
    branches: [main]
    paths:
      - 'edition/**'
      - 'scripts/**'
      - 'web/src/data/**'
      - 'web/test/edition/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    paths:
      - 'edition/**'
      - 'scripts/**'
      - 'web/src/data/**'
      - 'web/test/edition/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pipeline tests and rebuild check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # test_audio.py encodes and measures audio with ffmpeg, numpy and soundfile (books#37)
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q Pillow -r scripts/audio/requirements.txt
      - name: Unit and consistency tests
        run: |
          python scripts/catalog/test_catalog.py
          cd scripts/audio && python test_audio.py
      # The Gutenberg files are cached between runs; a cold cache downloads them at ~1 per second.
      # sources.lock.json pins each file, so a file Gutenberg has re-released fails the check.
      # Saved even when the check fails, so a download Gutenberg cut short is resumed next run
      # instead of starting cold again; a new key per run, restored from the latest one.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/books-gutenberg
          key: gutenberg-${{ github.run_id }}
          restore-keys: gutenberg-
      - name: Rebuild every book and compare with the committed files
        run: python scripts/catalog/fetch.py ~/.cache/books-gutenberg --check
      - name: Verify source completeness and clean book content
        run: python scripts/catalog/qa.py ~/.cache/books-gutenberg
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/books-gutenberg
          key: gutenberg-${{ github.run_id }}
