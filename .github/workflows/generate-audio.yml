name: Generate audio

# Pre-generates Kokoro narration for the named catalogue books and uploads it to the
# serge-ivo/books-audio dataset on Hugging Face (books#4), with sentence timings
# (books#22). Run by hand; it skips chapters already uploaded, so a re-run resumes.
# Each shard commits the manifest with its chapters, so they appear as they finish (books#18).
# Only the books named in `books` are narrated and published: there is no "every book" mode,
# and other books' audio in the dataset stays out of the manifest (books#27).
# mode=manifest narrates nothing: it only rebuilds the named books' manifest entries from the audio
# already in the dataset; there `books: all-existing` names every book with audio (books#31).
# Narration comes with a title clip per chapter and is loudness-normalised (books#37). mode=titles makes
# only the title clips missing next to chapters already narrated (all of them with force), and also
# takes `books: all-existing`; it adds no chapter audio.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: narrate (plan, narrate, publish), titles (only the missing chapter title clips) or manifest (only publish what is already uploaded)
        type: choice
        options: [narrate, titles, manifest]
        default: narrate
      voice:
        description: Kokoro voice id
        default: af_heart
      books:
        description: Space-separated catalogue slugs, e.g. alice-in-wonderland (required); titles and manifest modes also take all-existing
        required: true
      force:
        description: Narrate these books again even where audio exists (in titles mode, their title clips)
        type: boolean
        default: false

permissions:
  contents: read

env:
  REPO: serge-ivo/books-audio
  HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  VOICE: ${{ inputs.voice }}
  BOOKS: ${{ inputs.books }}
  FORCE: ${{ inputs.force && '--force' || '' }}
  TITLES: ${{ inputs.mode == 'titles' && '--titles' || '' }}

jobs:
  plan:
    if: inputs.mode != 'manifest'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require named books
        run: |
          [ -n "${BOOKS// }" ] || { echo "::error::Name the books to narrate (books#27)"; exit 1; }
          if [ "${{ inputs.mode }}" = titles ]; then
            [ "$BOOKS" = all-existing ] || [[ " $BOOKS " != *" all-existing "* ]] || { echo "::error::all-existing stands alone"; exit 1; }
          else
            [[ " $BOOKS " != *" all-existing "* ]] || { echo "::error::all-existing is for mode=titles or manifest only (books#31)"; exit 1; }
          fi
      - run: pip install -q -r scripts/audio/requirements.txt
      - run: hf repos create "$REPO" --repo-type dataset --public --exist-ok
      - id: plan
        run: echo "matrix=$(python scripts/audio/plan.py web/public/catalog "$REPO" "$VOICE" $FORCE $TITLES $BOOKS)" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    if: >-
      needs.plan.outputs.matrix != '{"include": []}'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      # The org has 20 Actions slots; leave some for app deploys
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r scripts/audio/requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download model
        run: |
          mkdir -p models && cd models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -f "$f" ] || curl -fsSL -o "$f" "$base/$f"; done
      - name: Narrate and upload
        env:
          UNITS: ${{ matrix.units }}
        run: python scripts/audio/generate.py models web/public/catalog "$REPO" "$VOICE" $TITLES $UNITS

  manifest:
    needs: [plan, generate]
    # After a narration (plan succeeded), or on its own in manifest mode (plan skipped)
    if: >-
      ${{ !cancelled() && (needs.plan.result == 'success'
      || (inputs.mode == 'manifest' && needs.plan.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require named books
        run: |
          [ -n "${BOOKS// }" ] || { echo "::error::Name the books, or all-existing (books#27)"; exit 1; }
          [ "$BOOKS" = all-existing ] || [[ " $BOOKS " != *" all-existing "* ]] || { echo "::error::all-existing stands alone"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ffprobe measures audio without timings
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r scripts/audio/requirements.txt
      # Shards publish it as they go; this catches a shard that died before its last commit.
      # Manifest mode: publishes what is already in the dataset for the named books.
      - run: python scripts/audio/manifest.py web/public/catalog "$REPO" "$VOICE" $BOOKS
