name: Generate audio

# Pre-generates Kokoro narration for the public catalogue and uploads it to the
# serge-ivo/books-audio dataset on Hugging Face (books#4), with sentence timings
# (books#22). Run by hand; it skips chapters already uploaded, so a re-run resumes.
# Each shard commits the manifest with its chapters, so they appear as they finish (books#18).

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice id
        default: af_heart
      books:
        description: Space-separated slugs (empty = every book not yet narrated)
        default: ''
      force:
        description: Narrate these books again even where audio exists
        type: boolean
        default: false

permissions:
  contents: read

env:
  REPO: serge-ivo/books-audio
  HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  VOICE: ${{ inputs.voice }}
  BOOKS: ${{ inputs.books }}
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r scripts/audio/requirements.txt
      - run: hf repos create "$REPO" --repo-type dataset --public --exist-ok
      - id: plan
        run: echo "matrix=$(python scripts/audio/plan.py web/public/catalog "$REPO" "$VOICE" $FORCE $BOOKS)" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    if: >-
      needs.plan.outputs.matrix != '{"include": []}'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      # The org has 20 Actions slots; leave some for app deploys
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r scripts/audio/requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download model
        run: |
          mkdir -p models && cd models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -f "$f" ] || curl -fsSL -o "$f" "$base/$f"; done
      - name: Narrate and upload
        env:
          UNITS: ${{ matrix.units }}
        run: python scripts/audio/generate.py models web/public/catalog "$REPO" "$VOICE" $UNITS

  manifest:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r scripts/audio/requirements.txt
      # Shards publish it as they go; this catches a shard that died before its last commit
      - run: python scripts/audio/manifest.py web/public/catalog "$REPO" $BOOKS
